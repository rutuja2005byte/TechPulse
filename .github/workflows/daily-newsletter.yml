name: TechPulse Daily Newsletter

on:
  schedule:
    # 08:00 India Standard Time (UTC+05:30).
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      send_newsletter:
        description: Send a new production newsletter (otherwise this is a safe no-send run)
        required: false
        type: boolean
        default: false
      retry_failed_newsletter:
        description: Retry today's existing failed, unsent newsletter record
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: techpulse-daily-newsletter-${{ github.repository }}
  cancel-in-progress: false

jobs:
  daily-pipeline:
    name: Collect, process, and deliver TechPulse
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Validate manual delivery choice
        if: github.event_name == 'workflow_dispatch'
        env:
          SEND_NEWSLETTER: ${{ inputs.send_newsletter }}
          RETRY_FAILED_NEWSLETTER: ${{ inputs.retry_failed_newsletter }}
        run: |
          if [[ "$SEND_NEWSLETTER" == "true" && "$RETRY_FAILED_NEWSLETTER" == "true" ]]; then
            echo 'Choose either a new send or a retry, not both.' >&2
            exit 1
          fi

      - name: Collect RSS articles
        id: collect
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.retry_failed_newsletter) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/techpulse-collect.log"
          npm run collect 2>&1 | tee "$log_file"
          LOG_FILE="$log_file" node <<'NODE'
          const fs = require('node:fs');
          const log = fs.readFileSync(process.env.LOG_FILE, 'utf8');
          const match = /News collection complete:\s*\{[\s\S]*?\bstored:\s*(\d+)/.exec(log);
          if (!match) throw new Error('Could not read the stored-article count from collector output.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `stored=${match[1]}\n`);
          console.log(`New articles stored: ${match[1]}`);
          NODE

      - name: Analyze eligible articles with Gemini
        id: ai
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.retry_failed_newsletter) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/techpulse-ai.log"
          npm run process:ai 2>&1 | tee "$log_file"
          LOG_FILE="$log_file" node <<'NODE'
          const fs = require('node:fs');
          const log = fs.readFileSync(process.env.LOG_FILE, 'utf8');
          const match = /AI processing complete:\s*\{[\s\S]*?\bstoriesCreated:\s*(\d+),[\s\S]*?\bstoriesUpdated:\s*(\d+)/.exec(log);
          if (!match) throw new Error('Could not read story creation/update counts from AI processor output.');
          const changed = Number(match[1]) + Number(match[2]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `stories_created=${match[1]}\nstories_updated=${match[2]}\nstories_changed=${changed}\n`);
          console.log(`Stories created or updated: ${changed}`);
          NODE

      - name: Generate newsletter preview
        id: preview
        if: ${{ steps.ai.outputs.stories_changed != '0' && !(github.event_name == 'workflow_dispatch' && inputs.retry_failed_newsletter) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/techpulse-newsletter-preview.log"
          if npm run newsletter -- --preview > "$log_file" 2>&1; then
            cat "$log_file"
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          elif grep -Fq 'No valid stories meet the newsletter importance threshold' "$log_file"; then
            cat "$log_file"
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'No sufficiently important stories; safely skipping email delivery.'
          else
            cat "$log_file"
            exit 1
          fi

      - name: Send or safely retry newsletter
        if: >-
          (github.event_name == 'schedule' && steps.preview.outputs.eligible == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.send_newsletter && steps.preview.outputs.eligible == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.retry_failed_newsletter)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.retry_failed_newsletter }}" == "true" ]]; then
            npm run newsletter -- --retry
          else
            npm run newsletter -- --send
          fi
